<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 450" role="img" aria-labelledby="title desc">
  <title id="title">Resilience hub at a community facility</title>
  <desc id="desc">A community hall and sports ground prepared as a resilience hub with solar, battery storage, communications, water and space for temporary accommodation during disruption.</desc>
  <defs><pattern id="grid" width="22" height="22" patternUnits="userSpaceOnUse"><path d="M22 0H0V22" fill="none" stroke="#ced8c5" stroke-width=".6"/></pattern><pattern id="solar" width="16" height="13" patternUnits="userSpaceOnUse" patternTransform="skewX(-15)"><rect x="1" y="1" width="13" height="10" fill="#42665d" stroke="#a8c2ab" stroke-width=".6"/></pattern></defs>
  <rect width="560" height="450" fill="url(#grid)"/><path d="M30 358L140 404 531 310" fill="none" stroke="#f9f6e9" stroke-width="30"/><path d="M30 358L140 404 531 310" fill="none" stroke="#b8beac" stroke-width="2" stroke-dasharray="5 8"/>
  <path d="M63 70H499V306H63Z" fill="#d8e4cc" stroke="#9bb08e" stroke-width="2"/><rect x="254" y="103" width="181" height="100" fill="#f8f3df" stroke="#688160" stroke-width="2"/><path d="M254 103l27-33h183l-29 33Z" fill="#244f45"/><path d="M285 74h169l-23 25H264Z" fill="url(#solar)"/>
  <text x="344" y="145" text-anchor="middle" font-family="Arial" font-size="13" fill="#315846">COMMUNITY HALL</text><text x="344" y="165" text-anchor="middle" font-family="Arial" font-size="10" fill="#536e56">cool refuge · meals · information</text>
  <ellipse cx="179" cy="192" rx="88" ry="55" fill="#b8cca5" stroke="#eff2db" stroke-width="12"/><text x="179" y="190" text-anchor="middle" font-family="Arial" font-size="11" fill="#3d5b36" letter-spacing="1">SPORT + GATHERING</text><text x="179" y="207" text-anchor="middle" font-family="Arial" font-size="10" fill="#4c6644">normal days, too</text>
  <rect x="276" y="232" width="44" height="52" rx="4" fill="#77906e" stroke="#45634d" stroke-width="2"/><path d="M298 241l-8 14h10l-5 13" fill="none" stroke="#f5f2da" stroke-width="3"/><text x="298" y="301" text-anchor="middle" font-family="Arial" font-size="9" fill="#315846">BATTERY</text>
  <rect x="356" y="236" width="54" height="48" rx="4" fill="#a9c2c1" stroke="#426b69" stroke-width="2"/><path d="M369 256h28m-14-13v27" stroke="#426b69" stroke-width="3"/><text x="383" y="301" text-anchor="middle" font-family="Arial" font-size="9" fill="#315846">WATER</text>
  <path d="M448 242v-46m0 0l-18 23m18-23 18 23" stroke="#426b69" stroke-width="3" fill="none"/><circle cx="448" cy="196" r="4" fill="#426b69"/><text x="448" y="258" text-anchor="middle" font-family="Arial" font-size="9" fill="#315846">COMMS</text>
  <g fill="#fbf6e8" stroke="#607b5d" stroke-width="1.5"><path d="M94 268l43-10 27 18v25l-44 10-26-18Z"/><path d="M169 270l43-10 27 18v25l-44 10-26-18Z"/><path d="M95 222l43-10 27 18v25l-44 10-26-18Z"/></g>
  <g fill="#789468"><circle cx="81" cy="112" r="15"/><circle cx="117" cy="98" r="13"/><circle cx="463" cy="98" r="16"/><circle cx="470" cy="292" r="15"/></g>
  <g font-family="Arial" font-size="11" fill="#244639" stroke="#758b6c"><path d="M275 70V38H181" fill="none"/><text x="84" y="30" stroke="none">01 / Solar keeps essentials running</text><path d="M434 111V70H533" fill="none"/><text x="425" y="61" stroke="none">02 / Ordinary community hall</text><path d="M323 258H214v78" fill="none"/><text x="100" y="348" stroke="none">03 / Temporary bays when needed</text><path d="M411 257h98v51" fill="none"/><text x="410" y="322" stroke="none">04 / Water + communications</text></g>
  <text x="280" y="428" text-anchor="middle" font-family="Arial" font-size="10" fill="#536e56" letter-spacing="1.2">USEFUL EVERY DAY · READY WHEN A COMMUNITY NEEDS IT</text>
</svg>
