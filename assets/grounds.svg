v29" stroke="#365848" stroke-width="7"/><path d="M89 272l55-16 28 22-55 17Z" fill="#faf3df"/><path d="M89 272v30l28 21v-28Z" fill="#aab991"/><path d="M117 295l55-17v28l-55 17Z" fill="#c6d2b1"/><path d="M110 290v22m37-25v16" stroke="#45634d" stroke-width="6"/><g fill="#fbf6e8" stroke="#647c5c" stroke-width="1.5"><path d="M395 254l39-12 23 15v20l-40 12-22-15Z"/><path d="M348 302l39-12 23 15v20l-40 12-22-15Z"/><path d="M270 334l39-12 23 15v20l-40 12-22-15Z"/></g><g fill="#698672"><path d="M403 259l13 9v9l-13-9Zm22 6 22-7v8l-22 7Z"/><path d="M356 307l13 9v9l-13-9Zm22 6 22-7v8l-22 7Z"/><path d="M278 339l13 9v9l-13-9Zm22 6 22-7v8l-22 7Z"/></g><g fill="#2e483d"><circle cx="407" cy="281" r="4"/><circle cx="447" cy="282" r="4"/><circle cx="360" cy="329" r="4"/><circle cx="399" cy="330" r="4"/><circle cx="282" cy="361" r="4"/><circle cx="321" cy="362" r="4"/></g><path d="M258 112l28-8 16 12v32l-29 9-15-13Z" fill="#7e9870" stroke="#4e6e53"/><path d="M280 119l-6 13h9l-7 14" fill="none" stroke="#f0edcf" stroke-width="2"/><g fill="#769262" stroke="#617c50"><circle cx="83" cy="213" r="15"/><circle cx="463" cy="212" r="16"/><circle cx="220" cy="339" r="13"/><circle cx="444" cy="334" r="13"/></g><g font-family="Arial" font-size="11" fill="#244639"><path d="M157 103V74H57M403 91V58h104M273 105V46h-71M96 300H30v26M455 272h72v-28" fill="none" stroke="#758b6c"/><text x="28" y="66">01 / Solar + sheds</text><text x="375" y="49">02 / Community hub</text><text x="171" y="37">03 / Battery</text><text x="9" y="345">04 / Amenities</text><text x="433" y="235">05 / Places to stay</text><text x="333" y="416" font-size="10" letter-spacing="1.2">CONNECTED TO THE TOWN →</text></g></svg>
