<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Three places information can live</title>
  <desc id="desc">Information can be held privately in a person's safe, governed by an organisation in its own vault, or published as neutral shared rules and registers. Arrows indicate only agreed exchange between them.</desc>
  <defs><style>.bg{fill:#f7f2e8}.box{fill:#fffdf8;stroke:#294c3a;stroke-width:3}.green{fill:#dce8cf;stroke:#294c3a;stroke-width:3}.orange{fill:#f6e8db;stroke:#a95134;stroke-width:3}.head{font:700 28px Arial,sans-serif;fill:#18382a}.copy{font:19px Arial,sans-serif;fill:#385348}.note{font:700 18px Arial,sans-serif;fill:#18382a}.line{stroke:#799367;stroke-width:7;stroke-linecap:round;fill:none}</style><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#799367"/></marker></defs>
  <rect class="bg" width="1200" height="620" rx="24"/>
  <text x="600" y="62" text-anchor="middle" class="head" font-size="34">Information belongs in different places for different reasons</text>
  <text x="600" y="96" text-anchor="middle" class="copy">Keeping everything in one distant platform is not the only choice.</text>
  <path class="line" d="M395 286 H470 M730 286 H805" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <g transform="translate(70 165)"><rect class="green" width="325" height="250" rx="22"/><text class="head" x="28" y="63">Your safe</text><text class="copy" x="28" y="104">Private records held</text><text class="copy" x="28" y="132">under your instructions:</text><text class="copy" x="28" y="170">health, identity, family</text><text class="copy" x="28" y="198">and personal history.</text></g>
  <g transform="translate(470 165)"><rect class="box" width="260" height="250" rx="22"/><text class="head" x="26" y="63">A local vault</text><text class="copy" x="26" y="104">A club, council or</text><text class="copy" x="26" y="132">business keeps the</text><text class="copy" x="26" y="170">records it is responsible</text><text class="copy" x="26" y="198">for under agreed rules.</text></g>
  <g transform="translate(805 165)"><rect class="orange" width="325" height="250" rx="22"/><text class="head" x="28" y="63">Shared public rules</text><text class="copy" x="28" y="104">Common definitions,</text><text class="copy" x="28" y="132">public registers and</text><text class="copy" x="28" y="170">standards anyone can</text><text class="copy" x="28" y="198">check and use fairly.</text></g>
  <rect x="145" y="485" width="910" height="70" rx="16" fill="#e8edde"/><text x="600" y="528" text-anchor="middle" class="note">The key question is not “where is all the data?” but “who is responsible for this information?”</text>
</svg>
