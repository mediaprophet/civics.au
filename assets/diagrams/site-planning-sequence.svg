<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Four steps to plan a community site</title>
  <desc id="desc">Four steps: understand the site and its local conditions, list what it needs to run, compare energy and storage options, then test costs and assumptions before making a decision.</desc>
  <defs><style>.bg{fill:#f7f2e8}.box{fill:#fffdf8;stroke:#294c3a;stroke-width:3}.accent{fill:#d56a45}.head{font:700 27px Arial,sans-serif;fill:#18382a}.copy{font:19px Arial,sans-serif;fill:#385348}.note{font:700 18px Arial,sans-serif;fill:#18382a}.line{stroke:#799367;stroke-width:8;stroke-linecap:round;fill:none}</style><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#799367"/></marker></defs>
  <rect class="bg" width="1200" height="620" rx="24"/>
  <text x="600" y="62" text-anchor="middle" class="head" font-size="34">Use the planner as a conversation, not an answer machine</text>
  <text x="600" y="96" text-anchor="middle" class="copy">Start with local facts, then test options together.</text>
  <path class="line" d="M285 277 H330 M560 277 H605 M835 277 H880" marker-end="url(#arrow)"/>
  <g transform="translate(55 158)"><rect class="box" width="230" height="235" rx="18"/><circle class="accent" cx="34" cy="34" r="22"/><text x="34" y="42" text-anchor="middle" fill="#fff" font-family="Arial" font-weight="700">1</text><text class="head" x="24" y="88">Know the site</text><text class="copy" x="24" y="124">Location, buildings,</text><text class="copy" x="24" y="152">connection and local</text><text class="copy" x="24" y="180">sunlight conditions.</text></g>
  <g transform="translate(330 158)"><rect class="box" width="230" height="235" rx="18"/><circle class="accent" cx="34" cy="34" r="22"/><text x="34" y="42" text-anchor="middle" fill="#fff" font-family="Arial" font-weight="700">2</text><text class="head" x="24" y="88">List what it runs</text><text class="copy" x="24" y="124">Amenities, water,</text><text class="copy" x="24" y="152">lighting, workshops</text><text class="copy" x="24" y="180">and any new services.</text></g>
  <g transform="translate(605 158)"><rect class="box" width="230" height="235" rx="18"/><circle class="accent" cx="34" cy="34" r="22"/><text x="34" y="42" text-anchor="middle" fill="#fff" font-family="Arial" font-weight="700">3</text><text class="head" x="24" y="88">Test options</text><text class="copy" x="24" y="124">Compare solar, storage</text><text class="copy" x="24" y="152">and grid options using</text><text class="copy" x="24" y="180">your own figures.</text></g>
  <g transform="translate(880 158)"><rect class="box" width="265" height="235" rx="18"/><circle class="accent" cx="34" cy="34" r="22"/><text x="34" y="42" text-anchor="middle" fill="#fff" font-family="Arial" font-weight="700">4</text><text class="head" x="24" y="88">Check before deciding</text><text class="copy" x="24" y="124">Review costs, risks,</text><text class="copy" x="24" y="152">permissions and what</text><text class="copy" x="24" y="180">needs expert advice.</text></g>
  <rect x="160" y="480" width="880" height="70" rx="16" fill="#e8edde"/><text x="600" y="524" text-anchor="middle" class="note">A calculator can organise questions. It cannot replace engineering, approvals or community consent.</text>
</svg>
