<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">How a request travels through a personal data safe</title>
  <desc id="desc">A four-part process: a person asks, their data safe checks their rules, an organisation receives only the approved answer, then both sides receive a signed receipt.</desc>
  <defs><style>.bg{fill:#f7f2e8}.box{fill:#fffdf8;stroke:#294c3a;stroke-width:3}.accent{fill:#d56a45}.green{fill:#dce8cf}.ink{fill:#18382a}.copy{font:20px Arial,sans-serif;fill:#385348}.head{font:700 28px Arial,sans-serif;fill:#18382a}.mini{font:700 18px Arial,sans-serif;fill:#18382a}.num{font:700 23px Arial,sans-serif;fill:#fff}.line{stroke:#799367;stroke-width:8;stroke-linecap:round;fill:none}</style><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#799367"/></marker></defs>
  <rect class="bg" width="1200" height="650" rx="24"/>
  <text x="600" y="62" text-anchor="middle" class="head" font-size="34">A request without handing over the whole filing cabinet</text>
  <text x="600" y="96" text-anchor="middle" class="copy">Only the answer needed for the request is shared.</text>
  <path class="line" d="M280 276 H347 M603 276 H670 M926 276 H983" marker-end="url(#arrow)"/>
  <g transform="translate(55 158)"><rect class="box" width="225" height="234" rx="18"/><circle class="accent" cx="34" cy="34" r="22"/><text class="num" x="34" y="42" text-anchor="middle">1</text><text class="head" x="24" y="88">You ask</text><text class="copy" x="24" y="124">For example:</text><text class="copy" x="24" y="152">“Can I receive</text><text class="copy" x="24" y="180">this concession?”</text></g>
  <g transform="translate(347 158)"><rect class="green" width="256" height="234" rx="18"/><circle class="accent" cx="34" cy="34" r="22"/><text class="num" x="34" y="42" text-anchor="middle">2</text><text class="head" x="24" y="88">Your data safe</text><text class="copy" x="24" y="124">Checks the rules you</text><text class="copy" x="24" y="152">have set. It does not</text><text class="copy" x="24" y="180">send your whole record.</text></g>
  <g transform="translate(670 158)"><rect class="box" width="256" height="234" rx="18"/><circle class="accent" cx="34" cy="34" r="22"/><text class="num" x="34" y="42" text-anchor="middle">3</text><text class="head" x="24" y="88">A limited answer</text><text class="copy" x="24" y="124">The organisation gets</text><text class="copy" x="24" y="152">the approved answer —</text><text class="copy" x="24" y="180">not a dossier.</text></g>
  <g transform="translate(983 158)"><rect class="box" width="162" height="234" rx="18"/><circle class="accent" cx="34" cy="34" r="22"/><text class="num" x="34" y="42" text-anchor="middle">4</text><text class="head" x="24" y="88">Receipts</text><text class="copy" x="24" y="124">Both sides</text><text class="copy" x="24" y="152">keep proof</text><text class="copy" x="24" y="180">of the exchange.</text></g>
  <rect x="170" y="482" width="860" height="80" rx="16" fill="#e8edde"/><text x="600" y="518" text-anchor="middle" class="mini">The simple rule: you decide what may be shared, for what purpose, and a record remains.</text><text x="600" y="546" text-anchor="middle" class="copy" font-size="17">Technical readers: this is governed exchange with verifiable receipts.</text>
</svg>
