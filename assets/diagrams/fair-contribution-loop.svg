<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">How a fair contribution record could work</title>
  <desc id="desc">Four stages: a person contributes time, skill or materials; the contribution is recorded with their approval; a project produces a useful result; if the project earns money, recorded obligations can be considered for repayment under agreed rules.</desc>
  <defs><style>.bg{fill:#f7f2e8}.box{fill:#fffdf8;stroke:#294c3a;stroke-width:3}.accent{fill:#d56a45}.head{font:700 27px Arial,sans-serif;fill:#18382a}.copy{font:19px Arial,sans-serif;fill:#385348}.note{font:700 18px Arial,sans-serif;fill:#18382a}.line{stroke:#799367;stroke-width:8;stroke-linecap:round;fill:none}</style><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#799367"/></marker></defs>
  <rect class="bg" width="1200" height="620" rx="24"/>
  <text x="600" y="62" text-anchor="middle" class="head" font-size="34">A record of effort, not a promise of profit</text>
  <text x="600" y="96" text-anchor="middle" class="copy">The point is to make real contributions visible and reviewable.</text>
  <path class="line" d="M285 273 H330 M560 273 H605 M835 273 H880" marker-end="url(#arrow)"/>
  <g transform="translate(55 158)"><rect class="box" width="230" height="230" rx="18"/><circle class="accent" cx="34" cy="34" r="22"/><text x="34" y="42" text-anchor="middle" fill="#fff" font-family="Arial" font-weight="700">1</text><text class="head" x="24" y="88">Contribute</text><text class="copy" x="24" y="124">Time, skill, materials</text><text class="copy" x="24" y="152">or use of a shared</text><text class="copy" x="24" y="180">facility supports work.</text></g>
  <g transform="translate(330 158)"><rect class="box" width="230" height="230" rx="18"/><circle class="accent" cx="34" cy="34" r="22"/><text x="34" y="42" text-anchor="middle" fill="#fff" font-family="Arial" font-weight="700">2</text><text class="head" x="24" y="88">Record it</text><text class="copy" x="24" y="124">An agreed record says</text><text class="copy" x="24" y="152">what was contributed,</text><text class="copy" x="24" y="180">by whom and when.</text></g>
  <g transform="translate(605 158)"><rect class="box" width="230" height="230" rx="18"/><circle class="accent" cx="34" cy="34" r="22"/><text x="34" y="42" text-anchor="middle" fill="#fff" font-family="Arial" font-weight="700">3</text><text class="head" x="24" y="88">Make something useful</text><text class="copy" x="24" y="124">The project is tested,</text><text class="copy" x="24" y="152">used or delivered to</text><text class="copy" x="24" y="180">the community.</text></g>
  <g transform="translate(880 158)"><rect class="box" width="265" height="230" rx="18"/><circle class="accent" cx="34" cy="34" r="22"/><text x="34" y="42" text-anchor="middle" fill="#fff" font-family="Arial" font-weight="700">4</text><text class="head" x="24" y="88">If it earns</text><text class="copy" x="24" y="124">Agreed rules can guide</text><text class="copy" x="24" y="152">how recorded obligations</text><text class="copy" x="24" y="180">are repaid or recognised.</text></g>
  <rect x="140" y="475" width="920" height="74" rx="16" fill="#e8edde"/><text x="600" y="520" text-anchor="middle" class="note">A record makes the contribution visible. It does not guarantee that a project will earn money.</text>
</svg>
