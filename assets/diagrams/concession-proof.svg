<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc"><title id="title">How a concession proof could protect privacy</title><desc id="desc">A trusted issuer confirms eligibility, a person carries the proof, a service checks only whether the required rule is met, and the person receives the concession and a receipt without disclosing their whole history.</desc><defs><style>.b{fill:#f7f2e8}.c{fill:#fffdf8;stroke:#294c3a;stroke-width:3}.g{fill:#dce8cf;stroke:#294c3a;stroke-width:3}.a{fill:#d56a45}.h{font:700 27px Arial,sans-serif;fill:#18382a}.t{font:19px Arial,sans-serif;fill:#385348}.n{font:700 18px Arial,sans-serif;fill:#18382a}.l{stroke:#799367;stroke-width:8;stroke-linecap:round;fill:none}</style><marker id="x" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#799367"/></marker></defs><rect class="b" width="1200" height="600" rx="24"/><text x="600" y="58" text-anchor="middle" class="h" font-size="34">Show the fact needed, not your whole life story</text><path class="l" d="M285 264 H330 M560 264 H605 M835 264 H880" marker-end="url(#x)"/><g transform="translate(55 148)"><rect class="c" width="230" height="225" rx="18"/><circle class="a" cx="34" cy="34" r="22"/><text x="34" y="42" text-anchor="middle" fill="#fff" font-family="Arial" font-weight="700">1</text><text class="h" x="24" y="88">A trusted issuer</text><text class="t" x="24" y="124">Confirms a person</text><text class="t" x="24" y="152">meets an agreed</text><text class="t" x="24" y="180">eligibility rule.</text></g><g transform="translate(330 148)"><rect class="g" width="230" height="225" rx="18"/><circle class="a" cx="34" cy="34" r="22"/><text x="34" y="42" text-anchor="middle" fill="#fff" font-family="Arial" font-weight="700">2</text><text class="h" x="24" y="88">The person carries it</text><text class="t" x="24" y="124">A card or phone holds</text><text class="t" x="24" y="152">a proof they control</text><text class="t" x="24" y="180">and can revoke.</text></g><g transform="translate(605 148)"><rect class="c" width="230" height="225" rx="18"/><circle class="a" cx="34" cy="34" r="22"/><text x="34" y="42" text-anchor="middle" fill="#fff" font-family="Arial" font-weight="700">3</text><text class="h" x="24" y="88">The service checks</text><text class="t" x="24" y="124">It asks only: “Does</text><text class="t" x="24" y="152">this person meet this</text><text class="t" x="24" y="180">particular rule?”</text></g><g transform="translate(880 148)"><rect class="c" width="265" height="225" rx="18"/><circle class="a" cx="34" cy="34" r="22"/><text x="34" y="42" text-anchor="middle" fill="#fff" font-family="Arial" font-weight="700">4</text><text class="h" x="24" y="88">A fair result</text><text class="t" x="24" y="124">The concession and a</text><text class="t" x="24" y="152">receipt are provided;</text><text class="t" x="24" y="180">unneeded history stays private.</text></g><rect x="145" y="465" width="910" height="70" rx="16" fill="#e8edde"/><text x="600" y="508" text-anchor="middle" class="n">A checked proof can be enough. A name, diagnosis, address or history may not be needed.</text></svg>
