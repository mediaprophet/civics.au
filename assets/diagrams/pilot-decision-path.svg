<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">An evidence-led path from proposal to local decision</title>
  <desc id="desc">A sequence begins with a local need, then a small pilot and safeguards, evidence gathered from residents and the community, followed by an open decision to improve, stop or extend the work.</desc>
  <defs><style>.bg{fill:#f7f2e8}.box{fill:#fffdf8;stroke:#294c3a;stroke-width:3}.accent{fill:#d56a45}.head{font:700 27px Arial,sans-serif;fill:#18382a}.copy{font:19px Arial,sans-serif;fill:#385348}.note{font:700 18px Arial,sans-serif;fill:#18382a}.line{stroke:#799367;stroke-width:8;stroke-linecap:round;fill:none}</style><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#799367"/></marker></defs>
  <rect class="bg" width="1200" height="620" rx="24"/>
  <text x="600" y="62" text-anchor="middle" class="head" font-size="34">A proposal should earn trust through evidence</text>
  <text x="600" y="96" text-anchor="middle" class="copy">A pilot is a way to learn, not a commitment to roll everything out.</text>
  <path class="line" d="M285 277 H330 M560 277 H605 M835 277 H880" marker-end="url(#arrow)"/>
  <g transform="translate(55 158)"><rect class="box" width="230" height="235" rx="18"/><circle class="accent" cx="34" cy="34" r="22"/><text x="34" y="42" text-anchor="middle" fill="#fff" font-family="Arial" font-weight="700">1</text><text class="head" x="24" y="88">Name the need</text><text class="copy" x="24" y="124">Listen to residents,</text><text class="copy" x="24" y="152">community groups and</text><text class="copy" x="24" y="180">the people affected.</text></g>
  <g transform="translate(330 158)"><rect class="box" width="230" height="235" rx="18"/><circle class="accent" cx="34" cy="34" r="22"/><text x="34" y="42" text-anchor="middle" fill="#fff" font-family="Arial" font-weight="700">2</text><text class="head" x="24" y="88">Run a small pilot</text><text class="copy" x="24" y="124">Set safeguards, clear</text><text class="copy" x="24" y="152">roles and a limited</text><text class="copy" x="24" y="180">scope before starting.</text></g>
  <g transform="translate(605 158)"><rect class="box" width="230" height="235" rx="18"/><circle class="accent" cx="34" cy="34" r="22"/><text x="34" y="42" text-anchor="middle" fill="#fff" font-family="Arial" font-weight="700">3</text><text class="head" x="24" y="88">Gather evidence</text><text class="copy" x="24" y="124">Check safety, costs,</text><text class="copy" x="24" y="152">lived experience and</text><text class="copy" x="24" y="180">practical outcomes.</text></g>
  <g transform="translate(880 158)"><rect class="box" width="265" height="235" rx="18"/><circle class="accent" cx="34" cy="34" r="22"/><text x="34" y="42" text-anchor="middle" fill="#fff" font-family="Arial" font-weight="700">4</text><text class="head" x="24" y="88">Decide openly</text><text class="copy" x="24" y="124">Improve it, extend it</text><text class="copy" x="24" y="152">carefully, or stop if</text><text class="copy" x="24" y="180">it does not work.</text></g>
  <rect x="155" y="480" width="890" height="70" rx="16" fill="#e8edde"/><text x="600" y="524" text-anchor="middle" class="note">The decision belongs to the community, informed by evidence rather than promises.</text>
</svg>
