<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" role="img" aria-labelledby="title desc">
  <title id="title">How a community ground works as shared infrastructure</title>
  <desc id="desc">Locally owned energy, water, amenities, workshops and connection support residents, events and resilience. Savings and income help maintain the shared infrastructure.</desc>
  <defs><style>.bg{fill:#f7f2e8}.box{fill:#fffdf8;stroke:#294c3a;stroke-width:3}.core{fill:#dce8cf;stroke:#294c3a;stroke-width:4}.accent{fill:#d56a45}.head{font:700 28px Arial,sans-serif;fill:#18382a}.copy{font:19px Arial,sans-serif;fill:#385348}.small{font:700 18px Arial,sans-serif;fill:#18382a}.line{stroke:#799367;stroke-width:7;stroke-linecap:round;fill:none}</style><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#799367"/></marker></defs>
  <rect class="bg" width="1200" height="660" rx="24"/>
  <text x="600" y="62" text-anchor="middle" class="head" font-size="34">One ground, several useful jobs</text>
  <text x="600" y="96" text-anchor="middle" class="copy">Shared assets support everyday life, community events and emergency resilience.</text>
  <g transform="translate(420 222)"><rect class="core" width="360" height="178" rx="24"/><text x="180" y="58" text-anchor="middle" class="head">The community ground</text><text x="180" y="94" text-anchor="middle" class="copy">Locally governed facilities</text><text x="180" y="122" text-anchor="middle" class="copy">and shared infrastructure</text></g>
  <g transform="translate(58 156)"><rect class="box" width="260" height="132" rx="18"/><circle class="accent" cx="34" cy="34" r="22"/><text x="34" y="42" text-anchor="middle" fill="#fff" font-family="Arial" font-weight="700">1</text><text class="head" x="24" y="86">Energy and water</text><text class="copy" x="24" y="114">Solar, batteries, utilities</text></g>
  <g transform="translate(58 402)"><rect class="box" width="260" height="132" rx="18"/><circle class="accent" cx="34" cy="34" r="22"/><text x="34" y="42" text-anchor="middle" fill="#fff" font-family="Arial" font-weight="700">2</text><text class="head" x="24" y="86">Amenities and bays</text><text class="copy" x="24" y="114">Safe, practical daily living</text></g>
  <g transform="translate(882 156)"><rect class="box" width="260" height="132" rx="18"/><circle class="accent" cx="34" cy="34" r="22"/><text x="34" y="42" text-anchor="middle" fill="#fff" font-family="Arial" font-weight="700">3</text><text class="head" x="24" y="86">Workshop and skills</text><text class="copy" x="24" y="114">Tools, repairs and learning</text></g>
  <g transform="translate(882 402)"><rect class="box" width="260" height="132" rx="18"/><circle class="accent" cx="34" cy="34" r="22"/><text x="34" y="42" text-anchor="middle" fill="#fff" font-family="Arial" font-weight="700">4</text><text class="head" x="24" y="86">Events and resilience</text><text class="copy" x="24" y="114">A useful local base in disruption</text></g>
  <path class="line" d="M318 222 H410 M318 468 H410 M790 222 H882 M790 468 H882" marker-end="url(#arrow)"/>
  <path class="line" d="M1015 540 C1015 616,190 616,190 540" marker-end="url(#arrow)"/>
  <text x="600" y="626" text-anchor="middle" class="small">Savings, fees and locally generated income help maintain the shared assets.</text>
</svg>
