<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 450" role="img" aria-labelledby="title desc">
  <title id="title">Town-edge community ground</title>
  <desc id="desc">An existing town-edge depot and car park adapted with solar canopies, a shared workshop, gardens, amenities and bays for homes on wheels.</desc>
